name: 'Apply latest configuration to Fleet'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering
  schedule:
  - cron: '0 6 * * *' # Nightly 6AM UTC

# Prevent concurrent runs of this workflow.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Limit permissions of GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  validate-apple-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v6

      - name: Validate Apple profiles and declarations (contour)
        run: |
          curl -fsSL -o contour.tar.gz \
            https://github.com/macadmins/contour/releases/download/v0.4.0-beta.4/contour-0.4.0-beta.4-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf contour.tar.gz

          ./contour profile validate ./platforms/macos/configuration-profiles -r --strict

          ./contour profile ddm validate ./platforms/macos/declaration-profiles -r
          ./contour profile ddm validate ./platforms/all/declaration-profiles -r
          ./contour profile ddm verify ./platforms/macos/declaration-profiles -r
          ./contour profile ddm verify ./platforms/all/declaration-profiles -r

          dupes=$(find platforms/macos/declaration-profiles platforms/all/declaration-profiles \
            -name '*.json' -exec jq -r '.Identifier' {} + | sort | uniq -d)
          [ -z "$dupes" ] || { printf 'duplicate declaration identifiers:\n%s\n' "$dupes"; exit 1; }

  fleet-gitops:
    needs: validate-apple-profiles
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets from 1Password
        id: op-secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLEET_URL: op://GitHub/FleetSecrets/FLEET_URL
          FLEET_API_TOKEN: op://GitHub/FleetSecrets/FLEET_API_TOKEN
          GLOBAL_ENROLL_SECRET: op://GitHub/FleetSecrets/GLOBAL_ENROLL_SECRET
          SSO_METADATA_URL: op://GitHub/FleetSecrets/SSO_METADATA_URL
          FLEET_SERVERS_ENROLL_SECRET: op://GitHub/FleetSecrets/FLEET_SERVERS_ENROLL_SECRET
          FLEET_WORKSTATIONS_ENROLL_SECRET: op://GitHub/FleetSecrets/FLEET_WORKSTATIONS_ENROLL_SECRET
          FLEET_MOBILE_DEVICES_ENROLL_SECRET: op://GitHub/FleetSecrets/FLEET_MOBILE_DEVICES_ENROLL_SECRET
          FLEET_AUTOPKG_TESTING_ENROLL_SECRET: op://GitHub/FleetSecrets/FLEET_AUTOPKG_TESTING_ENROLL_SECRET
          FLEET_TESTING_ENROLL_SECRET: op://GitHub/FleetSecrets/FLEET_TESTING_ENROLL_SECRET
          FLEET_SECRET_SSH_USER: op://GitHub/FleetSecrets/FLEET_SECRET_SSH_USER
          FLEET_SECRET_SSH_PUBLIC_KEY: op://GitHub/FleetSecrets/FLEET_SECRET_SSH_PUBLIC_KEY
          FLEET_VULNERABILITY_WEBHOOK_URL: op://GitHub/FleetSecrets/FLEET_VULNERABILITY_WEBHOOK_URL
          
      - name: Checkout GitOps repository
        uses: actions/checkout@v6

      - name: Apply latest configuration to Fleet
        uses: ./.github/fleet-gitops
        with:
          # Run GitOps in dry-run mode for pull requests.
          dry-run-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        # Add FLEET_URL and FLEET_API_TOKEN to the repository secrets.
        # In addition, specify or add secrets for all the environment variables that are mentioned in the global/team YAML files.
        env:
          FLEET_URL: ${{ steps.op-secrets.outputs.FLEET_URL }}
          FLEET_API_TOKEN: ${{ steps.op-secrets.outputs.FLEET_API_TOKEN }}
          GLOBAL_ENROLL_SECRET: ${{ steps.op-secrets.outputs.GLOBAL_ENROLL_SECRET }}
          SSO_METADATA_URL: ${{ steps.op-secrets.outputs.SSO_METADATA_URL }}
          FLEET_SERVERS_ENROLL_SECRET: ${{ steps.op-secrets.outputs.FLEET_SERVERS_ENROLL_SECRET }}
          FLEET_WORKSTATIONS_ENROLL_SECRET: ${{ steps.op-secrets.outputs.FLEET_WORKSTATIONS_ENROLL_SECRET }}
          FLEET_MOBILE_DEVICES_ENROLL_SECRET: ${{ steps.op-secrets.outputs.FLEET_MOBILE_DEVICES_ENROLL_SECRET }}
          FLEET_AUTOPKG_TESTING_ENROLL_SECRET: ${{ steps.op-secrets.outputs.FLEET_AUTOPKG_TESTING_ENROLL_SECRET }}
          FLEET_TESTING_ENROLL_SECRET: ${{ steps.op-secrets.outputs.FLEET_TESTING_ENROLL_SECRET }}
          FLEET_SECRET_SSH_USER: ${{ steps.op-secrets.outputs.FLEET_SECRET_SSH_USER }}
          FLEET_SECRET_SSH_PUBLIC_KEY: ${{ steps.op-secrets.outputs.FLEET_SECRET_SSH_PUBLIC_KEY }}
          FLEET_VULNERABILITY_WEBHOOK_URL: ${{ steps.op-secrets.outputs.FLEET_VULNERABILITY_WEBHOOK_URL }}
