    platform: android
    self_service: true
    setup_experience: true
  # Gmail
  - app_store_id: com.google.android.gm
    platform: android
    self_service: true
    setup_experience: true
  # Google Calendar
  - app_store_id: com.google.android.calendar
    platform: android
    self_service: true
    setup_experience: true
  # Google Drive
  - app_store_id: com.google.android.apps.docs
    platform: android
    self_service: true
    setup_experience: true
  # Google Docs
  - app_store_id: com.google.android.apps.docs.editors.docs
    platform: android
    self_service: true
    setup_experience: true
  # Google Sheets
  - app_store_id: com.google.android.apps.docs.editors.sheets
    platform: android
    self_service: true
    setup_experience: true
  # Google Slides
  - app_store_id: com.google.android.apps.docs.editors.slides
    platform: android
    self_service: true
    setup_experience: true
  # Google Meet
  - app_store_id: com.google.android.apps.tachyon
    platform: android
    self_service: true
    setup_experience: true
  # Google Chat
  - app_store_id: com.google.android.apps.dynamite
    platform: android
    self_service: true
    setup_experience: true
  # Google Keep
  - app_store_id: com.google.android.keep
    platform: android
    self_service: true
    setup_experience: true
  # Google Tasks
  - app_store_id: com.google.android.apps.tasks
    platform: android
    self_service: true
    setup_experience: true
  # Google Voice
  - app_store_id: com.google.android.apps.googlevoice
