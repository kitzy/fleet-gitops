name: Testing
policies:
- path: ../platforms/macos/policies/macos-gatekeeper.policies.yml
reports:
agent_options:
  path: ../platforms/agent-options.yml
controls:
  apple_settings:
    configuration_profiles:
    - path: ../platforms/macos/declaration-profiles/allow-beta-updates-ddm.json
    # No DDM declaration type exists for Gatekeeper enforcement yet, so this
    # stays a legacy .mobileconfig and targets all macOS versions.
    - path: ../platforms/macos/configuration-profiles/enforce-gatekeeper.mobileconfig
    # Legacy .mobileconfig profiles converted to DDM below — kept here for
    # hosts still on a pre-27 macOS release.
    - path: ../platforms/macos/configuration-profiles/ddm-demo-safari-settings.mobileconfig
      labels_include_any:
      - macOS < 27
    - path: ../platforms/macos/configuration-profiles/ddm-demo-caldav-account.mobileconfig
      labels_include_any:
      - macOS < 27
    - path: ../platforms/macos/configuration-profiles/ddm-demo-exchange-account.mobileconfig
      labels_include_any:
      - macOS < 27
    - path: ../platforms/macos/configuration-profiles/ddm-demo-root-certificate.mobileconfig
      labels_include_any:
      - macOS < 27
    # DDM conversions of the profiles above — delivered to macOS 27+ hosts.
    - path: ../platforms/macos/declaration-profiles/ddm-demo-safari-settings-ddm.json
      labels_include_any:
      - macOS 27
    - path: ../platforms/macos/declaration-profiles/ddm-demo-caldav-account-ddm.json
      labels_include_any:
      - macOS 27
    - path: ../platforms/macos/declaration-profiles/ddm-demo-exchange-account-ddm.json
      labels_include_any:
      - macOS 27
    - path: ../platforms/macos/declaration-profiles/ddm-demo-root-certificate-ddm.json
      labels_include_any:
      - macOS 27
    # DDM asset backing the root-certificate configuration above — Fleet
    # requires asset declarations (com.apple.asset.*) under a separate
    # `assets:` key rather than `configuration_profiles:`.
    assets:
    - path: ../platforms/macos/declaration-profiles/assets/ddm-demo-root-certificate-asset-ddm.json
      labels_include_any:
      - macOS 27
  setup_experience:
    apple_setup_assistant: ../platforms/macos/enrollment-profiles/automatic-enrollment.dep.json
settings:
  secrets:
  - secret: $FLEET_TESTING_ENROLL_SECRET
  features:
    enable_host_users: true
    enable_software_inventory: true
    historical_data:
      vulnerabilities: true
software:
