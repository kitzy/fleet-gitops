policies:
- path: ../platforms/macos/policies/macos-gatekeeper.policies.yml
reports:
agent_options:
  path: ../platforms/agent-options.yml
controls:
  apple_settings:
    configuration_profiles:
    - path: ../platforms/macos/declaration-profiles/allow-beta-updates-ddm.json
    - path: ../platforms/macos/configuration-profiles/enforce-gatekeeper.mobileconfig
    # Legacy .mobileconfig profiles — no DDM declaration type exists yet for
    # Gatekeeper, so this stays unscoped and continues to apply fleet-wide.
    # The four below are superseded by DDM declarations on macOS 27+ (see
    # below) and are scoped to older macOS so they don't double-apply.
    - path: ../platforms/macos/configuration-profiles/ddm-demo-safari-settings.mobileconfig
      labels_include_any:
        - macOS < 27
    - path: ../platforms/macos/configuration-profiles/ddm-demo-caldav-account.mobileconfig
      labels_include_any:
        - macOS < 27
    - path: ../platforms/macos/configuration-profiles/ddm-demo-exchange-account.mobileconfig
      labels_include_any:
        - macOS < 27
    - path: ../platforms/macos/configuration-profiles/ddm-demo-root-certificate.mobileconfig
      labels_include_any:
        - macOS < 27
    # DDM declarations — macOS 27+ only. Fleet manages the DDM activation
    # declaration itself; only configuration and asset declarations are
    # uploaded here (Fleet does not support submitting
    # com.apple.activation.* declarations directly).
    - path: ../platforms/macos/declaration-profiles/ddm-demo-safari-settings-configuration-ddm.json
      labels_include_any:
        - macOS 27 Golden Gate
    - path: ../platforms/macos/declaration-profiles/ddm-demo-caldav-account-configuration-ddm.json
      labels_include_any:
        - macOS 27 Golden Gate
    - path: ../platforms/macos/declaration-profiles/ddm-demo-exchange-account-configuration-ddm.json
      labels_include_any:
        - macOS 27 Golden Gate
    - path: ../platforms/macos/declaration-profiles/ddm-demo-root-certificate-configuration-ddm.json
      labels_include_any:
        - macOS 27 Golden Gate
    # Assets are inert data referenced by a configuration declaration above;
    # host targeting is governed by the referencing configuration's labels,
    # so these are left unscoped. Fleet's asset upload requires a
    # Payload.Reference.DataURL, so only Reference/DataURL-shaped asset
    # types (e.g. com.apple.asset.credential.certificate) can go here today
    # — com.apple.asset.useridentity (no Reference wrapper) isn't accepted,
    # which is why the Exchange account declaration doesn't set an identity.
    assets:
    - path: ../platforms/macos/declaration-profiles/ddm-demo-root-certificate-asset-ddm.json
  setup_experience:
    apple_setup_assistant: ../platforms/macos/enrollment-profiles/automatic-enrollment.dep.json
settings:
  secrets:
  - secret: $FLEET_TESTING_ENROLL_SECRET
  features:
    enable_host_users: true
    enable_software_inventory: true
    historical_data:
      vulnerabilities: true
software:
  app_store_apps:
  # Control browser for the per-app VPN test: not listed in the agent's
  # tunneled_apps, so its traffic should stay off WARP.
  - app_store_id: org.mozilla.firefox
    platform: android
    self_service: true
  # Android per-app VPN test. Managed config
  # follows the Android Management API struct form of Cloudflare's Intune
  # per-app VPN example; Testing fleet only.
  - app_store_id: com.cloudflare.cloudflareoneagent
    platform: android
    self_service: true
    setup_experience: true
    configuration:
      path: ../platforms/android/managed-app-configurations/cloudflare-one-agent-testing.json
  # Browser for the agent's sign-in flow and the per-app VPN test target.
  - app_store_id: com.android.chrome
    platform: android
    self_service: true
    setup_experience: true
  # Slack
  - app_store_id: com.Slack
    platform: android
    self_service: true
    setup_experience: true
  # Zoom
  - app_store_id: us.zoom.videomeetings
    platform: android
    self_service: true
    setup_experience: true
  # 1Password
