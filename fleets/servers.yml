# Fleets are available in Fleet Premium.

# This file updates policies, reports, agent options, controls, and software for hosts assigned to the "Servers" fleet.

# To add another fleet, create a new file in the fleets/ directory and copy and paste the contents from this file.
# Update the secret in the new file, then create the corresponding secret in GitHub Actions secrets.
# Then add that secret to .github/workflows/workflow.yml as an env variable.
# The secret name in the YAML file must match the secret name in GitHub Actions secrets.

name: Servers
policies:
  - path: ../platforms/linux/policies/baseline-user-ssh.policies.yml
  - path: ../platforms/linux/policies/os-patching.policies.yml
  - path: ../platforms/linux/policies/linux-emudhra-ca.policies.yml
  - path: ../platforms/linux/policies/homelab-vps-hardening.policies.yml
reports:
  - path: ../platforms/all/reports/collect-usb-devices.reports.yml
  - path: ../platforms/all/reports/collect-fleetd-update-channels.reports.yml
  - path: ../platforms/all/reports/collect-failed-login-attempts.reports.yml
  - path: ../platforms/all/reports/get-authorized-ssh-keys.reports.yml
  - path: ../platforms/all/reports/get-unencrypted-ssh-keys.reports.yml
  - path: ../platforms/all/reports/get-all-listening-ports-by-process.reports.yml
  - path: ../platforms/all/reports/dex-queries.reports.yml
  - path: ../platforms/macos/reports/get-local-administrator-accounts.reports.yml
  - path: ../platforms/macos/reports/get-securetoken-status.reports.yml
  - path: ../platforms/macos/reports/get-builtin-antivirus-status.reports.yml
  - path: ../platforms/macos/reports/dex-queries.reports.yml
  - path: ../platforms/macos/reports/get-macos-patch-history.reports.yml
  - path: ../platforms/linux/reports/get-openssl-versions.reports.yml
agent_options:
  path: ../platforms/agent-options.yml
controls:
  scripts:
  - path: ../platforms/linux/scripts/baseline-user-ssh.sh
  - path: ../platforms/linux/scripts/enable-unattended-upgrades.sh
  - path: ../platforms/all/scripts/remove-emudhra-roots-fleetd.sh
  - path: ../platforms/linux/scripts/update-ca-certificates-package.sh
  - path: ../platforms/linux/scripts/disable-sshd.sh
  - path: ../platforms/linux/scripts/lock-root-password.sh
  - path: ../platforms/linux/scripts/remove-extra-login-accounts.sh
  - path: ../platforms/linux/scripts/harden-network-sysctls.sh
  - path: ../platforms/linux/scripts/enable-docker-unattended-upgrades.sh
  - path: ../platforms/linux/scripts/enable-docker-live-restore.sh
  - path: ../platforms/linux/scripts/remove-snapd.sh
  apple_settings:
    configuration_profiles:
    - path: ../platforms/macos/configuration-profiles/all-macos/fleetd-full-disk-access.mobileconfig
    - path: ../platforms/all/declaration-profiles/disable-beta-updates-ddm.json
settings:
  secrets:
    - secret: "$FLEET_SERVERS_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true
    historical_data:
      vulnerabilities: true
software:
