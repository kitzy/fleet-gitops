agent_options:
  config:
    decorators:
      load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
    options:
      disable_distributed: false
      distributed_interval: 10
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 10
      pack_delimiter: /
  overrides:
custom_host_vitals:
  - name: Asset Tag
labels:
  - paths: ./labels/*.yml
org_settings:
  features:
    enable_host_users: true
    enable_software_inventory: true
    historical_data:
      vulnerabilities: true
  fleet_desktop:
    transparency_url:
  host_expiry_settings:
    host_expiry_enabled: true
    host_expiry_window: 90
  integrations:
    conditional_access_enabled: false
    google_calendar:
    # IdP host vitals (full name, groups, department) straight from Google
    # Workspace's directory, replacing SCIM from Authentik: Fleet ignores
    # SCIM while this is set. The key belongs to fleet-directory-sync in the
    # kitzy-homelab project (kitzy/homelab-gitops google/terraform); its
    # domain-wide delegation grants three read-only Directory API scopes.
    google_workspace:
      - api_key_json: $GOOGLE_WORKSPACE_API_KEY_JSON
        domain: kitzy.com
        impersonated_user_email: admin-kitzy@kitzy.com
    jira:
    zendesk:
  mdm:
    apple_business:
    - organization_name: Fleet Device Management Inc.
      macos_fleet: Testing
      ios_fleet: Testing
      ipados_fleet: Testing
    apple_server_url:
    end_user_authentication:
      entity_id:
      idp_name:
      issuer_uri:
      metadata:
      metadata_url:
    end_user_license_agreement:
    volume_purchasing_program:
  org_info:
    contact_url:
    org_logo_url_dark_mode:
    org_logo_url_light_mode:
    org_name: Kitzy.net
  secrets:
  - secret: ${GLOBAL_ENROLL_SECRET}
  server_settings:
    ai_features_disabled: false
    deferred_save_host: false
    enable_analytics: true
    live_reporting_disabled: false
    report_cap: 0
    discard_reports_data: false
    server_url: ${FLEET_URL}
  # Fleet admin SSO through Google Workspace: the custom SAML app "Fleet" in
  # the Google Admin console (values in kitzy/homelab-gitops google/README.md).
  # Its entity ID must match entity_id here. Google offers no metadata URL,
  # so the IdP metadata XML is stored, on one line, in 1Password
  # (FleetSecrets/SSO_METADATA); fleetctl inserts it into this YAML as is,
  # hence the single quotes.
  sso_settings:
    enable_jit_provisioning: false
    enable_sso: true
    enable_sso_idp_login: true
    entity_id: fleet
    idp_image_url:
    idp_name: Google
    metadata: '${SSO_METADATA}'
    metadata_url:
    sso_server_url: ${FLEET_URL}
  webhook_settings:
    activities_webhook:
      destination_url:
      enable_activities_webhook: false
    failing_policies_webhook:
      destination_url:
      enable_failing_policies_webhook: false
      host_batch_size: 0
    host_status_webhook:
      days_count: 0
      destination_url:
      enable_host_status_webhook: false
      host_percentage: 0
    interval: 24h0m0s
    vulnerabilities_webhook:
      destination_url: ${FLEET_VULNERABILITY_WEBHOOK_URL}
      enable_vulnerabilities_webhook: true
      host_batch_size: 1
  yara_rules:
policies:
- path: ./platforms/all/policies/npm-supply-chain-compromised-packages.policies.yml
reports:
