[organization]
name = "Kitzy"
domain = "net.kitzy.mdm"

[defaults]
deterministic_uuids = true

[validation]
fail_on_errors = true
fail_on_warnings = false
fail_on_deprecations = false

[secrets]

[mdm_variables]
mdm = "fleet"

# Available fleet variables — uncomment an entry under
# [mdm_variables.pool] and reference it in recipes as `var:NAME`.
# [mdm_variables.pool]
# NDES_SCEP_CHALLENGE = "FLEET_VAR_NDES_SCEP_CHALLENGE"
# NDES_SCEP_PROXY_URL = "FLEET_VAR_NDES_SCEP_PROXY_URL"
# HOST_HARDWARE_SERIAL = "FLEET_VAR_HOST_HARDWARE_SERIAL"
# HOST_END_USER_IDP_USERNAME = "FLEET_VAR_HOST_END_USER_IDP_USERNAME"
# HOST_END_USER_IDP_USERNAME_LOCAL_PART = "FLEET_VAR_HOST_END_USER_IDP_USERNAME_LOCAL_PART"
# HOST_END_USER_IDP_GROUPS = "FLEET_VAR_HOST_END_USER_IDP_GROUPS"
# HOST_END_USER_IDP_DEPARTMENT = "FLEET_VAR_HOST_END_USER_IDP_DEPARTMENT"
# HOST_UUID = "FLEET_VAR_HOST_UUID"
# HOST_END_USER_IDP_FULL_NAME = "FLEET_VAR_HOST_END_USER_IDP_FULL_NAME"
# SCEP_RENEWAL_ID = "FLEET_VAR_SCEP_RENEWAL_ID"
# SCEP_WINDOWS_CERTIFICATE_ID = "FLEET_VAR_SCEP_WINDOWS_CERTIFICATE_ID"
# HOST_PLATFORM = "FLEET_VAR_HOST_PLATFORM"
# DIGICERT_DATA = "FLEET_VAR_DIGICERT_DATA_<suffix>"
# DIGICERT_PASSWORD = "FLEET_VAR_DIGICERT_PASSWORD_<suffix>"
# CUSTOM_SCEP_CHALLENGE = "FLEET_VAR_CUSTOM_SCEP_CHALLENGE_<suffix>"
# CUSTOM_SCEP_PROXY_URL = "FLEET_VAR_CUSTOM_SCEP_PROXY_URL_<suffix>"
# SMALLSTEP_SCEP_CHALLENGE = "FLEET_VAR_SMALLSTEP_SCEP_CHALLENGE_<suffix>"
# SMALLSTEP_SCEP_PROXY_URL = "FLEET_VAR_SMALLSTEP_SCEP_PROXY_URL_<suffix>"
